        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          description: 'Unprocessable entity: insufficient credits.'
          content:
            application/json:
              example:
                error: Unprocessable entity
