  "/api/find_people":
    post:
      summary: Search and enrich LinkedIn profiles
      description: |
        Search for LinkedIn profiles by company, job title, and location, then enrich each profile with detailed data (headline, about, connections, etc.).

        **Cost:** 5 scraping credits per enrichable profile (profiles with a LinkedIn URL). Hidden profiles (no LinkedIn URL) are included for free. Credits reserved = `limit` × 5 (default 50, max 150). Unused credits are refunded automatically.

        **Rate Limit:** 2 requests per second per user.

        **Sync mode (default):** If no `webhook_url` is provided, the request blocks until processing completes (10-20 seconds) and returns the full results.

        **Async mode:** If a `webhook_url` is provided, the request returns immediately with `202 Accepted` and the search ID. Results are pushed to the webhook when processing completes. Use `GET /api/find_people/{id}` to poll status.
      tags:
      - Find People
      parameters:
      - "$ref": "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - companies
              - jobtitles
              properties:
                companies:
                  type: string
                  description: 'LinkedIn company URLs or company IDs, comma-separated
                    (required). Example: https://www.linkedin.com/company/google,1441'
                  example: https://www.linkedin.com/company/google,1441
                jobtitles:
                  type: string
                  description: 'Job titles to search for, comma-separated (required).
                    Example: marketing,CMO'
                  example: marketing
                locations:
                  type: string
                  description: 'Locations to filter by, comma-separated (optional).
                    Example: Berlin,London'
                  example: Berlin
                limit:
                  type: integer
                  description: Maximum number of profiles to return (optional, 1-30,
                    default 10). Credits are reserved based on this value (limit ×
                    5 credits).
                  example: 10
                  minimum: 1
                  maximum: 30
                  default: 10
                webhook_url:
                  type: string
                  description: Optional webhook URL to receive results when processing
                    completes. Must use HTTPS. When provided, the request is processed
                    asynchronously.
                  example: https://example.com/webhooks/find-people
      responses:
        '200':
          description: Search and enrichment completed successfully (sync mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalResults:
                    type: integer
                    description: Total number of matching profiles found on LinkedIn
                    example: 19
                  totalReturned:
                    type: integer
                    description: Number of profiles returned in this response
                    example: 10
                  creditsCharged:
                    type: integer
                    description: Total credits charged for this request (5 per enrichable
                      profile)
                    example: 40
                  profiles:
                    type: array
                    items:
                      type: object
                      properties:
                        enriched:
                          type: boolean
                          description: Whether the profile was successfully enriched
                            with detailed data
                          example: true
                        linkedinUrl:
                          type: string
                          nullable: true
                          description: LinkedIn profile URL
                          example: https://www.linkedin.com/in/alexorig
                        firstName:
                          type: string
                          nullable: true
                          description: First name
                          example: Alex
                        lastName:
                          type: string
                          nullable: true
                          description: Last name
                          example: Schultz
                        position:
                          type: string
                          nullable: true
                          description: Current position title (from first experience)
                          example: CMO & VP Analytics
                        description:
                          type: string
                          nullable: true
                          description: Position description (from first experience)
                        startingDate:
                          type: string
                          nullable: true
                          description: Start date of current position (YYYY-MM or
                            YYYY-MM-DD)
                          example: 2026-01
                        companyId:
                          type: string
                          nullable: true
                          description: LinkedIn company ID of current employer
                          example: '10667'
                        companyName:
                          type: string
                          nullable: true
                          description: Current company name
                          example: Meta
                        companyLinkedinUrl:
                          type: string
                          nullable: true
                          description: LinkedIn URL of the current company
                          example: https://www.linkedin.com/company/10667/
                        headline:
                          type: string
                          nullable: true
                          description: LinkedIn headline
                          example: CMO & VP Analytics at Meta
                        about:
                          type: string
                          nullable: true
                          description: LinkedIn about section
                        openToWork:
                          type: boolean
                          nullable: true
                          description: Whether the person is open to work
                          example: false
                        hiring:
                          type: boolean
                          nullable: true
                          description: Whether the person is hiring
                          example: false
                        premium:
                          type: boolean
                          nullable: true
                          description: Whether the person has LinkedIn Premium
                          example: false
                        connectionsCount:
                          type: integer
                          nullable: true
                          description: Number of LinkedIn connections
                          example: 5000
                        followerCount:
                          type: integer
                          nullable: true
                          description: Number of LinkedIn followers
                          example: 12000
                        location:
                          type: string
                          nullable: true
                          description: Parsed location (city, country)
                          example: London, United Kingdom
              example:
                totalResults: 3
                totalReturned: 3
                creditsCharged: 10
                profiles:
                - enriched: true
                  linkedinUrl: https://www.linkedin.com/in/alexorig
                  firstName: Alex
                  lastName: Schultz
                  position: CMO & VP Analytics
                  description:
                  startingDate: 2026-01
                  companyId: '10667'
                  companyName: Meta
                  companyLinkedinUrl: https://www.linkedin.com/company/10667/
                  headline: CMO & VP Analytics at Meta
                  about:
                  openToWork: false
                  hiring: false
                  premium: false
                  connectionsCount: 5000
                  followerCount: 12000
                  location: London, United Kingdom
                - enriched: false
                  linkedinUrl:
                  firstName:
                  lastName:
                  name: LinkedIn Member
                  position: Global CMO | Marketing VP
                  description:
                  startingDate:
                  companyId:
                  companyName:
                  companyLinkedinUrl:
                  headline:
                  about:
                  openToWork:
                  hiring:
                  premium:
                  connectionsCount:
                  followerCount:
                  location: United Kingdom
        '202':
          description: Accepted - Search enqueued for async processing. Results will
            be pushed to the webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Search ID for polling status
