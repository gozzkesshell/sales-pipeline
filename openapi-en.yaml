    get:
      summary: List all reverse lookups
      description: 'Returns a list of all reverse lookups for the authenticated user,
        sorted by creation date (most recent first). Limited to 100 results.

        '
      tags:
      - Reverse Lookups
      parameters:
      - "$ref": "#/components/parameters/AuthorizationHeader"
      responses:
        '200':
          description: OK - Reverse lookups retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reverse_lookups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 123
                        name:
                          type: string
                          example: API Lookup 2026-03-28 10:00:00 UTC
                        status:
                          type: string
                          enum:
                          - pending
                          - processing
                          - refunding
                          - generating_csv
                          - completed
                          - failed
                          example: completed
                        total_emails:
                          type: integer
                          example: 1000
                        processed_emails:
                          type: integer
                          example: 1000
                        matches:
                          type: integer
                          example: 250
                        credits_per_match:
                          type: integer
                          example: 20
                        file_url:
                          type: string
                          nullable: true
                          example: https://s3.amazonaws.com/exports/reverse_lookups/lookup_123.csv
                        created_at:
                          type: string
                          format: date-time
                          example: '2026-03-28T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      summary: Create a reverse lookup
      description: |
        Submits a batch of email addresses for reverse lookup to find their LinkedIn profile URLs.

        **Cost:** 20 scraping credits per email. Credits are deducted upfront and refunded for emails that don't match a LinkedIn profile.

        **Maximum:** 10,000 emails per lookup.

        **Rate Limit:** 5 requests per minute per user.

        **Processing:** This is an asynchronous endpoint. The request returns immediately with the lookup ID. Use `GET /api/reverse_lookups/{id}` to poll status, or provide a `webhook_url` to receive a notification when processing completes.
      tags:
      - Reverse Lookups
      parameters:
      - "$ref": "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - emails
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Array of email addresses to look up (required, max
                    10,000)
                  example:
                  - john@acme.com
                  - jane@company.io
                name:
                  type: string
                  description: Optional name for this lookup (auto-generated if blank,
                    max 100 characters)
                  example: My Lookup
                webhook_url:
                  type: string
                  format: uri
                  description: Optional webhook URL to receive a notification when
                    the lookup completes. Must use HTTPS.
                  example: https://myapp.com/webhooks/vayne
      responses:
        '201':
          description: Created - Reverse lookup submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reverse_lookup:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 123
                      name:
                        type: string
                        example: My Lookup
                      status:
                        type: string
                        example: pending
                      total_emails:
                        type: integer
                        example: 1000
                      credits_per_match:
                        type: integer
                        example: 20
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-03-28T10:00:00Z'
        '400':
          description: 'Bad request: missing or invalid parameters.'
          content:
            application/json:
              example:
                error: Bad Request
                details: 'Missing required parameter: emails (array of email addresses)'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          description: 'Conflict: a reverse lookup with this name already exists.'
          content:
            application/json:
              example:
                error: Conflict
                details: A reverse lookup with this name already exists
        '422':
          description: 'Unprocessable entity: invalid emails or insufficient credits.'
          content:
            application/json:
              example:
                error: Unprocessable entity
                details: This file requires 20000 credits (1000 emails × 20 credits
                  each), but you only have 5000 credits available.
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      callbacks:
        onReverseLookupCompleted:
          "{$request.body#/webhook_url}":
            post:
              summary: Notification sent when reverse lookup completes or fails
              description: |
                Sent to the per-request webhook_url or your default webhook URL.
                Includes an `X-Vayne-Signature` header containing `sha256=<hex_digest>` for HMAC verification using your webhook signing secret.
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        event:
                          type: string
                          enum:
                          - reverse_lookup.completed
                          - reverse_lookup.failed
                          example: reverse_lookup.completed
                        reverse_lookup:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 123
                            name:
                              type: string
                              example: My Lookup
                            status:
                              type: string
                              example: completed
                            total_emails:
                              type: integer
                              example: 1000
                            matches:
                              type: integer
                              example: 250
                            credits_per_match:
                              type: integer
                              example: 20
                            export_url:
                              type: string
                              example: https://s3.amazonaws.com/exports/reverse_lookups/lookup_123.csv
                            created_at:
                              type: string
                              format: date-time
                              example: '2026-03-28T10:00:00Z'
              responses:
                '200':
                  description: Notification received successfully
  "/api/reverse_lookups/{id}":
    get:
      summary: Get reverse lookup details and results
      description: |
        Returns the current status and results of a reverse lookup.

        Results are paginated (default 100, max 500 per page).
      tags:
      - Reverse Lookups
      parameters:
      - "$ref": "#/components/parameters/AuthorizationHeader"
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Unique identifier of the reverse lookup
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: 'Page number for results pagination (default: 1)'
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 500
        description: 'Results per page (default: 100, max: 500)'
      responses:
        '200':
          description: OK - Reverse lookup details retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reverse_lookup:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 123
                      name:
                        type: string
                        example: My Lookup
                      status:
                        type: string
                        enum:
                        - pending
                        - processing
                        - refunding
                        - generating_csv
                        - completed
                        - failed
                        example: completed
                      total_emails:
                        type: integer
                        example: 1000
                      processed_emails:
                        type: integer
                        example: 1000
                      matches:
                        type: integer
                        example: 250
                      credits_per_match:
                        type: integer
                        example: 20
                      file_url:
                        type: string
                        nullable: true
                        example: https://s3.amazonaws.com/exports/reverse_lookups/lookup_123.csv
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-03-28T10:00:00Z'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: john@acme.com
                        linkedin_url:
                          type: string
                          example: https://www.linkedin.com/in/johndoe
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 100
                      total_results:
                        type: integer
                        example: 1000
                      total_pages:
                        type: integer
                        example: 10
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          description: 'Not found: reverse lookup not found.'
          content:
            application/json:
              example:
                error: Not Found
                details: Reverse lookup not found
  "/api/reverse_lookups/{id}/export":
    get:
      summary: Get CSV export URL
      description: |
        Returns the download URL for the CSV export of a completed reverse lookup.

        Returns HTTP 202 if the export file is still being generated.
      tags:
      - Reverse Lookups
      parameters:
      - "$ref": "#/components/parameters/AuthorizationHeader"
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Unique identifier of the reverse lookup
      responses:
        '200':
          description: OK - Export URL retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_url:
                    type: string
                    example: https://s3.amazonaws.com/exports/reverse_lookups/lookup_123.csv
        '202':
          description: Accepted - Export file is being generated.
          content:
            application/json:
              example:
                error: Not ready
                details: Export file is being generated
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          description: 'Not found: reverse lookup not found.'
          content:
            application/json:
              example:
                error: Not Found
                details: Reverse lookup not found
        '422':
          description: Lookup not yet completed.
          content:
            application/json:
              example:
                error: Not ready
                details: Lookup not yet completed
